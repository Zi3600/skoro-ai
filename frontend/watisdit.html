<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wat is dit — lokaal b16</title>
  <meta name="theme-color" content="#1a8fd4" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="stylesheet" href="app.css" />
  <style>
    body { overflow: auto; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 13px 24px;
      background: var(--chrome);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--edge-soft);
      box-shadow: 0 2px 8px rgba(100,200,255,0.3);
    }
    header span {
      font-size: 17px; font-weight: 700; color: var(--heading);
      text-shadow: 0 1px 2px rgba(255,255,255,0.9);
    }
    html[data-theme="dark"] header span { text-shadow: none; }
    header a { font-size: 12px; color: var(--text-muted); }
    header a:hover { text-decoration: underline; }

    .wrap { max-width: 560px; margin: 70px auto; padding: 0 24px; }
    .wrap p {
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
    }
  </style>
</head>
<body>

<header>
  <span>lokaal b16</span>
  <a href="index.html">terug</a>
</header>

<div class="wrap">
  <div class="card">
    <p>Exclusief schoolproject waar we proberen een workflow te ontwikkelen voor onze klas. Pure memes eigenlijk.</p>
  </div>
</div>

<script>
  if (localStorage.getItem("darkMode") === "1") document.documentElement.setAttribute("data-theme", "dark");
</script>

</body>
</html>
